<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>任务流程编辑器</title><link rel="stylesheet" href="task-editor.css"></head>
<body><header class="topbar"><div id="auth-panel"></div><div><a href="/task">预览</a><span>/</span><strong>任务流程编辑器</strong></div><div><button id="add-node">+ 新节点</button><button id="save" class="primary">保存流程</button></div></header><main class="shell"><aside><div class="heading"><h1>节点</h1><span id="count"></span></div><div id="node-list"></div></aside><section><h1>流程设置</h1><label>标题<input id="flow-title"></label><label>简介<textarea id="flow-description" rows="3"></textarea></label><label>初始节点<select id="initial-node"></select></label><hr><div class="heading"><h1>当前节点</h1><button id="delete-node" class="danger">删除</button></div><label>节点 ID<input id="node-id" readonly></label><label>标题<input id="node-title"></label><label>内容<textarea id="node-content" rows="7"></textarea></label></section><section><div class="heading"><h1>转移</h1><button id="add-transition">+ 添加</button></div><div id="transitions"></div><p id="empty" class="muted">暂无转移。</p></section></main><div id="notice"></div><script src="js/auth-panel.js"></script><script src="js/flow-editor-core.js"></script><script src="task-editor.js"></script></body></html>
