<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台</title>
  <link rel="stylesheet" href="workbench.css">
</head>
<body>
  <main class="workbench">
    <header class="workbench-header">
      <div id="auth-panel"></div>
      <div class="heading"><p class="eyebrow">WORKSPACE</p><h1>工作台</h1></div>
      <nav><a href="/apps">应用中心</a><button id="refresh" type="button" title="刷新">刷新</button></nav>
    </header>
    <div class="toolbar"><label for="filter">流程</label><select id="filter"><option value="all">全部</option><option value="submitted">我提交的申请</option><option value="tasks">分配给我的任务</option><option value="approvals">等待我审批</option><option value="completed">已完成</option></select><span id="notice" role="status"></span></div>
    <section id="lists" class="lists" aria-live="polite"></section>
  </main>
  <script src="js/auth-panel.js"></script>
  <script src="workbench.js"></script>
</body>
</html>
