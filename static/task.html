<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>任务流程</title><link rel="stylesheet" href="task.css"></head>
<body>
  <main class="task-shell">
    <header class="task-header"><div id="auth-panel"></div><a href="/">返回游戏</a><div><p class="eyebrow">TASK FLOW</p><h1 id="title">加载中</h1><p id="description"></p></div><div class="task-actions"><button id="new-task" type="button">新建任务</button><button id="reset">重置</button></div></header>
    <section class="task-panel"><p id="node-id" class="eyebrow"></p><h2 id="node-title"></h2><p id="node-content"></p><div id="transitions" class="transitions"></div><p id="error" class="error" hidden></p></section>
    <aside class="history"><strong>流程实例</strong><p id="process-summary"></p><strong>流程记录</strong><ol id="history"></ol></aside>
    <div id="save-panel"></div>
    <footer><a href="/task/editor">编辑任务流程</a><span id="assignee"></span></footer>
  </main>
  <script src="js/auth-panel.js"></script>
  <script src="js/app-save-panel.js"></script>
  <script src="task.js"></script>
</body>
</html>
